  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0d0f14;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(120, 90, 255, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(255, 60, 90, 0.10), transparent);
      color: #e8eaf0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 3px #0d0f14, 0 0 0 5px rgba(255, 255, 255, 0.12);
      margin-bottom: 6px;
      user-select: none;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .tagline {
      font-size: 14px;
      color: #8b90a0;
      text-align: center;
      margin-bottom: 18px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #e8eaf0;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .link-card svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .link-card span {
      flex: 1;
      text-align: center;
      /* offset the icon width so the label sits visually centered */
      margin-right: 38px;
    }

    .socials {
      display: flex;
      gap: 18px;
      margin-top: 10px;
    }

    .social-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #e8eaf0;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .social-icon:hover,
    .social-icon:focus-visible {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .social-icon svg {
      width: 26px;
      height: 26px;
    }

    .social-icon.youtube:hover { color: #ff0033; }
    .social-icon.tiktok:hover { color: #69c9d0; }
    .social-icon.instagram:hover { color: #e1306c; }
    .link-card.merch:hover svg { color: #ffb84d; }
    .link-card.gitlab:hover svg { color: #fc6d26; }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #565b6b;
    }
