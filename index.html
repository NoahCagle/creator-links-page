  <style>
    :root {
      --paper: #efede6;
      --ink: #161512;
      --muted: #6e6a60;
      --rule: #cfcabd;
      --accent: #e2471c;
      --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141412;
        --ink: #ecebe5;
        --muted: #8d897f;
        --rule: #34322d;
        --accent: #ff6a3d;
      }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      min-height: 100vh;
      padding: clamp(40px, 10vh, 96px) 20px 40px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 440px;
      margin: 0 auto;
      animation: fadeIn 1s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ---- header ---- */

    header {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 18px;
      align-items: end;
      padding-bottom: 28px;
    }

    .avatar {
      width: 84px;
      height: 84px;
      display: block;
      object-fit: cover;
      border-radius: 3px;
      outline: 1px solid var(--ink);
      outline-offset: 3px;
      user-select: none;
    }

    h1 {
      font-size: 34px;
      font-weight: 800;
      font-stretch: 112%;
      letter-spacing: -0.025em;
      line-height: 0.95;
    }

    .tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ---- link lists ---- */

    a { color: inherit; text-decoration: none; }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .primary {
      list-style: none;
      border-top: 1.5px solid var(--ink);
    }

    .primary li { border-bottom: 1px solid var(--rule); }

    .primary a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 10px 18px 2px;
    }

    .primary .label {
      display: block;
      font-size: 21px;
      font-weight: 700;
      font-stretch: 105%;
      letter-spacing: -0.01em;
    }

    .primary .dest,
    .social .handle {
      display: block;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .primary .dest { margin-top: 3px; }

    .arrow {
      font-family: var(--mono);
      font-size: 18px;
      flex-shrink: 0;
      transition: transform 0.12s ease-out;
    }

    .primary a:hover .arrow { transform: translate(2px, -2px); color: var(--accent); }

    .social {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 36px;
      border-top: 1.5px solid var(--ink);
    }

    .social li { border-bottom: 1px solid var(--rule); }
    .social li:nth-child(odd) { border-right: 1px solid var(--rule); }

    .social a {
      display: grid;
      grid-template-columns: 18px 1fr;
      column-gap: 10px;
      align-items: center;
      padding: 14px 12px;
    }

    .social svg {
      width: 18px;
      height: 18px;
      grid-row: span 2;
    }

    .social .name {
      font-weight: 600;
      font-size: 15px;
    }

    .primary a:hover,
    .social a:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .primary a:hover .dest,
    .social a:hover .handle { color: var(--paper); opacity: 0.65; }

    footer {
      margin-top: 40px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      .arrow { transition: none; }
    }
  </style>
